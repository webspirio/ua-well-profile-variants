<!doctype html>
<!--
  UA WELL /members — the «Учасники» directory in VARIANT B's language
  =====================================================================
  Idea: a calm Contacts-style directory where every row answers "who is this?" at a glance:
  photo · name · «Чим займаюся» headline (the new one-line LinkedIn-style field) · city · level.

  LAYOUT (390x844, Telegram fullscreen, safe top T = 92)
    large title «Учасники 24» in the flow, under the Telegram pills
    tools (search + «Фільтри» button, then removable active-filter chips) stick at T; a glass bar fills 0..T+tools
      once the title has scrolled away and a small centred «Учасники» fades in (one class toggle, nothing per frame)
    SORT + SECTIONS by FIRST name (uk collation): «Роман Білик» lives under Р
    letter headers stick under the tools
    row: 52px photo / initials · name 16/620 · headline 14.5 (the row's main line) · city · level 13 tertiary
      no headline -> two lines, no blank line
    «Показати ще» reveals the next window (the real API pages by 100)
  ALPHABET SCRUBBER (iPhone Contacts): the full Ukrainian alphabet down the right edge; press or drag a finger along
    it and the list jumps to that letter (a letter with nobody jumps to the next one that has people). A bubble shows
    the letter under the finger. Pointer capture, instant scroll, only re-scrolls when the letter changes.
  FILTERS: one «Фільтри» button (count badge) opens the full filter sheet — Пакет · Місто · Інтереси · Сфера діяльності,
    multi-select, live-apply like the app (OR inside a section, AND across sections). Footer: «Скинути» + «Показати N».
  SEARCH matches name AND headline; the matched part is marked.
  ROW TAP -> variant-b.html?view=other (the other-member profile).
-->
<html lang="uk" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --font: "Geist", -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --safe-top: 92px;           /* status bar + Telegram pill row (simulated --app-safe-top) */
  --safe-bottom: 34px;
  --tabbar-h: 56px;
  --ease: cubic-bezier(.32,.72,0,1);

  --bg:#FAF9F7; --surface:#FFFFFF; --text:#1C1C1C; --muted:#57534E; --tertiary:#78716C;
  --hairline:#ECEAE5; --line:#DCD8D0; --brand:#FF8912; --on-brand:#1C1C1C; --ink:#B45309;
  --tile:#F3F1EC; --tile-fg:#57534E; --tile-ink:rgba(180,83,9,.10);
  --press: rgba(28,28,28,.045);
  --seg-track:#EFEDE8; --seg-thumb:#FFFFFF; --seg-thumb-shadow: 0 1px 2px rgba(28,25,23,.08), 0 3px 8px -2px rgba(28,25,23,.12);
  --card-shadow: 0 0 0 .5px #ECEAE5, 0 1px 2px rgba(28,25,23,.04), 0 8px 24px -12px rgba(28,25,23,.10);
  --card-shadow-press: 0 0 0 .5px #ECEAE5;
  --admin-shadow: 0 0 0 .5px #ECEAE5, 0 1px 2px rgba(28,25,23,.05), 0 12px 28px -12px rgba(180,83,9,.22);
  --admin-glow: rgba(255,137,18,.10);
  --lip: 0 -12px 32px rgba(0,0,0,.18);
  --chrome-bg: color-mix(in oklab, var(--surface) 88%, transparent);
  --toast-bg: #1C1C1C; --toast-fg:#FAF9F7;
  --sheet-bg:#FFFFFF;
  --photo-color:#3b3a33;
  --veil-max:.35;
  --ok:#15803D; --ok-bg:rgba(22,163,74,.12); --bad:#B91C1C; --bad-bg:rgba(220,38,38,.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181819; --surface:#242426; --text:#F5F5F4; --muted:#B8B3AD; --tertiary:#8F8A82;
    --hairline:#2C2C2F; --line:#3A3A3E; --ink:#FF8912;
    --tile:#2F2F33; --tile-fg:#B8B3AD; --tile-ink:rgba(255,137,18,.14);
    --press: rgba(245,245,244,.06);
    --seg-track:#1C1C1E; --seg-thumb:#3A3A3E; --seg-thumb-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    --card-shadow: 0 0 0 1px #2C2C2F, inset 0 1px 0 rgba(255,255,255,.04);
    --card-shadow-press: 0 0 0 1px #2C2C2F;
    --admin-shadow: 0 0 0 1px #3A3A3E, inset 0 1px 0 rgba(255,255,255,.05);
    --admin-glow: rgba(255,137,18,.09);
    --lip: 0 -12px 32px rgba(0,0,0,.4);
    --toast-bg:#F5F5F4; --toast-fg:#1C1C1C;
    --sheet-bg:#242426;
    --veil-max:.5;
    --ok:#4ADE80; --ok-bg:rgba(74,222,128,.14); --bad:#F87171; --bad-bg:rgba(248,113,113,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181819; --surface:#242426; --text:#F5F5F4; --muted:#B8B3AD; --tertiary:#8F8A82;
  --hairline:#2C2C2F; --line:#3A3A3E; --ink:#FF8912;
  --tile:#2F2F33; --tile-fg:#B8B3AD; --tile-ink:rgba(255,137,18,.14);
  --press: rgba(245,245,244,.06);
  --seg-track:#1C1C1E; --seg-thumb:#3A3A3E; --seg-thumb-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  --card-shadow: 0 0 0 1px #2C2C2F, inset 0 1px 0 rgba(255,255,255,.04);
  --card-shadow-press: 0 0 0 1px #2C2C2F;
  --admin-shadow: 0 0 0 1px #3A3A3E, inset 0 1px 0 rgba(255,255,255,.05);
  --admin-glow: rgba(255,137,18,.09);
  --lip: 0 -12px 32px rgba(0,0,0,.4);
  --toast-bg:#F5F5F4; --toast-fg:#1C1C1C;
  --sheet-bg:#242426;
  --veil-max:.5;
  --ok:#4ADE80; --ok-bg:rgba(74,222,128,.14); --bad:#F87171; --bad-bg:rgba(248,113,113,.14);
  color-scheme: dark;
}

/* ---------- reset / mobile-web ---------- */
*,*::before,*::after{box-sizing:border-box}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);
  scroll-padding-top:calc(var(--safe-top) + 8px);scroll-padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 8px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow-x:hidden}
button,a{font:inherit;color:inherit;-webkit-touch-callout:none;touch-action:manipulation}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
a{text-decoration:none}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html.theme-anim body, html.theme-anim .card, html.theme-anim .panel, html.theme-anim .tabbar-glass, html.theme-anim .seg{
  transition:background-color .28s ease, color .28s ease, box-shadow .28s ease}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}


.col{position:relative;width:100%;max-width:430px;margin:0 auto}
.fixed-col{position:fixed;left:0;right:0;margin:0 auto;width:100%;max-width:430px}
html.locked,html.locked body{overflow:hidden}

/* ---------- top glass (behind the Telegram pills) ---------- */
#top{top:0;z-index:20;pointer-events:none;height:calc(var(--safe-top) + var(--tools-h,60px))}
#top .glass-bar{position:absolute;inset:0;background:color-mix(in oklab,var(--bg) 80%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--line);
  opacity:0;transition:opacity .22s ease}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ #top .glass-bar{background:var(--bg)} }
#top .ttl{position:absolute;left:50%;top:70px;transform:translate(-50%,-50%) translateY(6px);font-size:15px;font-weight:650;letter-spacing:-.01em;
  opacity:0;transition:opacity .22s ease,transform .3s var(--ease)}
html.stuck #top .glass-bar{opacity:1}
html.stuck #top .ttl{opacity:1;transform:translate(-50%,-50%)}
html.reduced #top .ttl{transform:translate(-50%,-50%)}

/* ---------- flow ---------- */
main{padding:calc(var(--safe-top) + 4px) 0 calc(var(--tabbar-h) + var(--safe-bottom) + 24px)}
.lt-title{display:flex;align-items:baseline;gap:10px;margin:0 20px 10px;font-size:34px;font-weight:720;letter-spacing:-.03em;line-height:1.1}
.lt-title .n{font:500 17px/1 var(--mono);color:var(--tertiary);letter-spacing:0;font-variant-numeric:tabular-nums}

.tools{position:sticky;top:var(--safe-top);z-index:21;padding:6px 16px 10px}
.trow{display:flex;gap:8px}
.search{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:12px;background:var(--tile);color:var(--tertiary)}
.search svg.i{width:18px;height:18px}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--text);padding:0}
.search input::placeholder{color:var(--tertiary)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{width:32px;height:32px;border-radius:50%;display:none;place-items:center;color:var(--tertiary)}
.search .clr svg.i{width:16px;height:16px;stroke-width:2.25}
.search.has .clr{display:grid}
.search:focus-within{box-shadow:0 0 0 2px var(--ink)}
.fbtn{position:relative;flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tile);color:var(--text);transition:background-color .2s ease,transform .25s var(--ease)}
.fbtn svg.i{width:20px;height:20px}
.fbtn.on{background:var(--brand);color:#1C1C1C}
.fbtn .badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:none;place-items:center;
  font:700 11.5px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--bg);background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.fbtn.on .badge{display:grid}
.active{display:flex;gap:6px;margin:10px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.active::-webkit-scrollbar{display:none}
.active:empty{display:none}
.ac{flex:none;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 6px 0 11px;border-radius:999px;font-size:13.5px;font-weight:550;
  color:var(--ink);background:var(--tile-ink)}
.ac svg.i{width:14px;height:14px;stroke-width:2.4}
.ac .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
html:not(.reduced) .pressable.is-pressed{transform:scale(.97)}

.sec{margin-top:6px;scroll-margin-top:calc(var(--safe-top) + var(--tools-h,60px))}
.lt{position:sticky;top:calc(var(--safe-top) + var(--tools-h,60px));z-index:10;margin:0;padding:10px 24px 6px;
  font:650 13px/1 var(--mono);letter-spacing:.06em;color:var(--ink);background:linear-gradient(var(--bg) 70%,transparent)}
.card{margin:0 30px 0 16px;background:var(--surface);border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden}
.m{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;min-height:76px;width:100%;text-align:left;color:inherit;transition:background-color .2s ease}
.m + .m::before{content:"";position:absolute;top:0;left:80px;right:0;height:1px;background:var(--hairline);transform:scaleY(.5);transform-origin:top}
.m.is-pressed{background:var(--press)}
.m:focus-visible{outline-offset:-3px;border-radius:16px}
.av{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;object-position:50% 25%;background:var(--tile)}
.av.ini{display:grid;place-items:center;font-size:18px;font-weight:650;letter-spacing:-.02em;color:#fff;
  background:radial-gradient(120% 120% at 28% 18%,var(--a1) 0,var(--a2) 100%)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-size:16px;font-weight:620;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl{font-size:14.5px;line-height:1.3;color:var(--text);opacity:.86;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tertiary);white-space:nowrap;overflow:hidden}
.mt .lv{display:inline-flex;align-items:center;gap:5px}
.lvdot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--lvc,var(--tertiary))}
.business{--lvc:var(--brand)} .standard{--lvc:#A8A29E} .start{--lvc:#D6D3D1}
mark{background:rgba(255,137,18,.28);color:inherit;border-radius:3px;padding:0 1px}

.more{display:flex;justify-content:center;margin:20px 30px 0 16px}
.more button{height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;color:var(--ink);background:var(--surface);box-shadow:var(--card-shadow)}
.foot{margin:16px 30px 0 16px;text-align:center;font-size:13px;color:var(--tertiary)}
.empty{margin:56px 32px 0;text-align:center;color:var(--muted)}
.empty .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--tile);color:var(--tertiary)}
.empty h3{margin:0 0 6px;font-size:17px;font-weight:650;color:var(--text)}
.empty p{margin:0 0 16px;font-size:14.5px}
.empty button{height:40px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--ink);background:var(--tile-ink)}

/* section reveal (once, opacity + 8px) */
html:not(.reduced) .rv{opacity:0;transform:translateY(8px);transition:opacity .36s ease,transform .42s var(--ease)}
html:not(.reduced) .rv.in{opacity:1;transform:none}

/* ---------- alphabet scrubber (iPhone Contacts) ---------- */
#idx{position:fixed;z-index:25;right:max(0px,calc((100vw - 430px) / 2));width:28px;
  top:calc(var(--safe-top) + var(--title-h,58px) + var(--tools-h,60px) + 4px);bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 10px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
#idx[hidden]{display:none}
#idx ol{list-style:none;margin:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;border-radius:14px;transition:background-color .2s ease}
#idx li{font:650 10.5px/1 var(--font);color:var(--ink);height:var(--lh,15px);display:grid;place-items:center;width:28px}
#idx li.off{color:var(--tertiary);opacity:.45}
#idx.drag ol{background:var(--tile)}
#bubble{position:fixed;z-index:26;right:calc(max(0px,(100vw - 430px) / 2) + 40px);width:56px;height:56px;margin-top:-28px;border-radius:50%;
  display:grid;place-items:center;font-size:26px;font-weight:700;color:#1C1C1C;background:var(--brand);
  box-shadow:0 10px 24px -8px rgba(255,137,18,.7);opacity:0;transform:scale(.6);transition:opacity .15s ease,transform .2s var(--ease);pointer-events:none}
#bubble.on{opacity:1;transform:none}

/* ---------- filter sheet ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s ease}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;margin:0 auto;width:100%;max-width:430px;bottom:0;z-index:71;max-height:calc(100% - var(--safe-top) - 6px);display:flex;flex-direction:column;
  background:var(--sheet-bg);border-radius:32px 32px 0 0;transform:translateY(105%);transition:transform .42s var(--ease);box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.sheet.open{transform:none}
.sheet:focus{outline:none}
html.reduced .sheet{transform:none;opacity:0;pointer-events:none;transition:opacity .15s ease}
html.reduced .sheet.open{opacity:1;pointer-events:auto}
.sh-top{flex:none;padding:8px 16px 4px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.sh-head h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sh-x{background:var(--tile);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;position:relative}
.sh-x::after{content:"";position:absolute;inset:-6px}
.sh-x svg.i{width:16px;height:16px;stroke-width:2.25}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 16px}
.fs{margin-top:22px}
.fs:first-child{margin-top:8px}
.fs-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.fs-h h4{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
.fs-h .cnt{font:600 12.5px/1 var(--mono);color:var(--ink)}
.fs-h .clr2{font-size:13.5px;font-weight:600;color:var(--ink);padding:4px 0}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;background:var(--tile);text-align:left;
  transition:background-color .2s ease,box-shadow .2s ease,transform .25s var(--ease)}
.pk .lvdot{width:10px;height:10px}
.pk b{font-size:15px;font-weight:650}
.pk small{font-size:12px;color:var(--tertiary);font-variant-numeric:tabular-nums}
.pk button[aria-pressed="true"]{background:var(--tile-ink);box-shadow:inset 0 0 0 1.5px var(--brand)}
.fsearch{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--tile);color:var(--tertiary);margin-bottom:10px}
.fsearch svg.i{width:16px;height:16px}
.fsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--text)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;font-size:14.5px;font-weight:550;color:var(--text);
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background-color .2s ease,box-shadow .2s ease,color .2s ease,transform .25s var(--ease)}
.tag small{font-size:12px;color:var(--tertiary);font-variant-numeric:tabular-nums}
.tag svg.i{width:15px;height:15px;stroke-width:2.6;display:none}
.tag[aria-pressed="true"]{background:var(--brand);color:#1C1C1C;box-shadow:none}
.tag[aria-pressed="true"] small{color:rgba(28,28,28,.6)}
.tag[aria-pressed="true"] svg.i{display:block}
.tag.zero{opacity:.45}
.tags .none{font-size:14px;color:var(--tertiary);padding:6px 4px}
.sh-foot{flex:none;display:flex;gap:10px;padding:12px 16px calc(var(--safe-bottom) + 8px);box-shadow:0 -.5px 0 var(--line)}
.sh-foot button{height:50px;border-radius:14px;font-size:16px;font-weight:650}
.sh-foot .rs{flex:none;padding:0 18px;color:var(--text);background:var(--tile)}
.sh-foot .rs:disabled{opacity:.4}
.sh-foot .go{flex:1;color:#1C1C1C;background:var(--brand);box-shadow:0 8px 20px -10px rgba(255,137,18,.8);font-variant-numeric:tabular-nums}

/* ---------- tab bar ---------- */
.tabbar{bottom:0;z-index:40;height:calc(var(--tabbar-h) + var(--safe-bottom))}
.tabbar-glass{position:absolute;inset:0;background:var(--chrome-bg);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 -.5px 0 var(--line)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h);padding:0 4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--tertiary);border-radius:12px;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg.i{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab .av{width:25px;height:25px;border-radius:50%;object-fit:cover;object-position:50% 30%;box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--brand)}
.tab .av.ini{display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:radial-gradient(80% 80% at 20% 20%,#FF8912,#B45309)}
.tab:focus-visible{outline-offset:-2px}

/* ---------- simulated system chrome (NOT part of the design) ---------- */
.sys{z-index:100;pointer-events:none}
.sb{top:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;color:var(--sb,#fff);
  font:600 16.5px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.01em;transition:color .25s ease}
.sb .gl{display:flex;gap:6px;align-items:center}
.pill{position:absolute;top:53px;height:34px;border-radius:17px;background:rgba(44,44,48,.46);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;

  { key:'ind', title:'Сфера діяльності', opts: uniq(M.map(m => m.ind)),      search:'Пошук сфери…' },
];
const sel = { lv:new Set(), c:new Set(), int:new Set(), ind:new Set() };
const fq = { c:'', int:'', ind:'' };
const has = (m, key, vals) => key === 'int' ? m.int.some(v => vals.has(v)) : vals.has(m[key]);
function passFilters(m, skip){ for (const k in sel) if (k !== skip && sel[k].size && !has(m, k, sel[k])) return false; return true; }
const selCount = () => Object.values(sel).reduce((n, s) => n + s.size, 0);

const WINDOW = 14;
let shown = WINDOW, query = '';

const PAL = [['#FFB257','#C2600A'],['#F59E8B','#B4432B'],['#9DB4A0','#4D6B52'],['#A9B7D1','#4B5D82'],['#D8B4A0','#8A5A44'],['#C7B3E0','#6E5594']];
const hash = s => [...s].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[ch]);
function mark(text, q){
  if (!q) return esc(text);
  const i = text.toLocaleLowerCase('uk').indexOf(q); if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function avatar(m){
  if (m.ph) return `<img class="av" src="${m.ph}" alt="" loading="lazy" decoding="async">`;
  const [a1, a2] = PAL[hash(m.f + m.l) % PAL.length];
  return `<span class="av ini" style="--a1:${a1};--a2:${a2}" aria-hidden="true">${m.f[0]}${m.l[0]}</span>`;
}
function row(m, q){
  return `<a class="m pressable" href="variant-b.html?view=other&admin=0">${avatar(m)}<span class="tx">`
    + `<span class="nm">${mark(`${m.f} ${m.l}`, q)}</span>`
    + (m.h ? `<span class="hl">${mark(m.h, q)}</span>` : '')
    + `<span class="mt"><span>${esc(m.c)}</span><span aria-hidden="true">·</span><span class="lv ${m.lv}"><span class="lvdot"></span>${LV[m.lv]}</span></span>`
    + `</span></a>`;
}
const normQ = () => query.trim().toLocaleLowerCase('uk');
const passQuery = (m, q) => !q || `${m.f} ${m.l}`.toLocaleLowerCase('uk').includes(q) || m.h.toLocaleLowerCase('uk').includes(q);
const results = () => { const q = normQ(); return M.filter(m => passFilters(m) && passQuery(m, q)); };

let present = new Set(), hitsNow = [];
function render(){
  const q = normQ();
  const hits = results(); hitsNow = hits;
  $('#count').textContent = hits.length;
  const list = $('#list');
  if (!hits.length) {
    list.innerHTML = `<div class="empty"><div class="ic"><svg class="i" viewBox="0 0 24 24">${I.search}</svg></div>`
      + `<h3>Нікого не знайдено</h3><p>${q ? `За запитом «${esc(query.trim())}» немає учасників.` : 'Жоден учасник не підходить під ці фільтри.'}</p>`
      + `<button id="reset" type="button">Скинути пошук і фільтри</button></div>`;
    $('#reset').onclick = () => { setQuery(''); clearAll(); };
    present = new Set(); buildIndex(); return;
  }
  const page = hits.slice(0, shown);
  const groups = new Map();
  page.forEach(m => { const L = letterOf(m); if (!groups.has(L)) groups.set(L, []); groups.get(L).push(m); });
  let html = '';
  for (const [L, ms] of groups) html += `<section class="sec rv" id="sec-${L}" aria-label="${L}"><h2 class="lt">${L}</h2><div class="card">${ms.map(m => row(m, q)).join('')}</div></section>`;
  if (hits.length > shown) html += `<div class="more"><button id="more" class="pressable" type="button">Показати ще</button></div>`;
  html += `<p class="foot">Показано ${page.length} з ${hits.length}</p>`;
  list.innerHTML = html;
  const more = $('#more'); if (more) more.onclick = () => { shown += WINDOW; render(); };
  present = new Set(hits.map(letterOf));   // every letter in the result, not only the loaded window
  buildIndex(); armReveal();
}
function setQuery(v){ query = v; $('#q').value = v; $('#search').classList.toggle('has', !!v); shown = WINDOW; }
function clearAll(){ for (const k in sel) sel[k].clear(); for (const k in fq) fq[k] = ''; afterFilter(); }

/* active-filter chips + badge */
function renderActive(){
  const n = selCount();
  $('#fbtn').classList.toggle('on', n > 0);
  $('#fbadge').textContent = n || '';
  $('#fbtn').setAttribute('aria-label', n ? `Фільтри (${n})` : 'Фільтри');
  const chips = [];
  for (const s of SECTIONS) for (const v of sel[s.key]) chips.push(`<button class="ac pressable" type="button" data-k="${s.key}" data-v="${esc(v)}" aria-label="Прибрати фільтр ${esc(s.label ? s.label(v) : v)}">${esc(s.label ? s.label(v) : v)}<span class="x"><svg class="i" viewBox="0 0 24 24">${I.x}</svg></span></button>`);
  $('#activeChips').innerHTML = chips.join('');
  measure();
}
$('#activeChips').addEventListener('click', e => { const b = e.target.closest('.ac'); if (!b) return; sel[b.dataset.k].delete(b.dataset.v); afterFilter(); });

/* ---------- filter sheet ---------- */
function countFor(key, v){ const q = normQ(); return M.filter(m => passFilters(m, key) && passQuery(m, q) && (key === 'int' ? m.int.includes(v) : m[key] === v)).length; }
function renderSheet(){
  const body = $('#shBody');
  const keepScroll = body.scrollTop;
  body.innerHTML = SECTIONS.map(s => {
    const n = sel[s.key].size;
    const head = `<div class="fs-h"><h4>${s.title}</h4>${n ? `<button class="clr2" type="button" data-clear="${s.key}">Скинути (${n})</button>` : ''}</div>`;
    if (s.kind === 'pk') return `<section class="fs">${head}<div class="pk">${s.opts.map(v =>
      `<button class="pressable ${v}" type="button" data-k="${s.key}" data-v="${v}" aria-pressed="${sel[s.key].has(v)}"><span class="lvdot"></span><b>${s.label(v)}</b><small>${countFor(s.key, v)} учасн.</small></button>`).join('')}</div></section>`;
    const f = fq[s.key].trim().toLocaleLowerCase('uk');
    const opts = s.opts.filter(v => !f || v.toLocaleLowerCase('uk').includes(f));
    return `<section class="fs">${head}`
      + (s.opts.length > 6 ? `<label class="fsearch"><svg class="i" viewBox="0 0 24 24">${I.search}</svg><span class="sr-only">${s.search}</span><input data-fq="${s.key}" type="search" autocomplete="off" placeholder="${s.search}" value="${esc(fq[s.key])}"></label>` : '')
      + `<div class="tags">${opts.length ? opts.map(v => { const c = countFor(s.key, v), on = sel[s.key].has(v);
          return `<button class="tag pressable${!c && !on ? ' zero' : ''}" type="button" data-k="${s.key}" data-v="${esc(v)}" aria-pressed="${on}"><svg class="i" viewBox="0 0 24 24">${I.check}</svg>${esc(v)}<small>${c}</small></button>`; }).join('')
        : `<span class="none">Нічого не знайдено</span>`}</div></section>`;
  }).join('');
  body.scrollTop = keepScroll;
  const n = results().length;
  $('#shGo').textContent = n ? `Показати ${n}` : 'Нікого не знайдено';
  $('#shReset').disabled = !selCount();
}
$('#shBody').addEventListener('click', e => {
  const c = e.target.closest('[data-clear]'); if (c) { sel[c.dataset.clear].clear(); afterFilter(); return; }
  const b = e.target.closest('[data-k]'); if (!b) return;
  const set = sel[b.dataset.k], v = b.dataset.v;
  set.has(v) ? set.delete(v) : set.add(v);
  afterFilter();
});
$('#shBody').addEventListener('input', e => {
  const k = e.target.dataset.fq; if (!k) return;
  fq[k] = e.target.value;
  const pos = e.target.selectionStart;
  renderSheet();
  const inp = $(`[data-fq="${k}"]`); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch {}
});
function afterFilter(){ shown = WINDOW; renderActive(); render(); if (sheetOpen) renderSheet(); }

let sheetOpen = false, lastFocus = null;
function openSheet(){ sheetOpen = true; lastFocus = document.activeElement; renderSheet(); root.classList.add('locked');
  $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); $('#sheet').setAttribute('aria-hidden','false'); setTimeout(() => $('#sheet').focus({ preventScroll:true }), 60); }
function closeSheet(){ sheetOpen = false; root.classList.remove('locked');
  $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true'); lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll:true }); }
$('#fbtn').addEventListener('click', openSheet);
$('#shX').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
$('#shGo').addEventListener('click', closeSheet);
$('#shReset').addEventListener('click', () => { for (const k in sel) sel[k].clear(); afterFilter(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });

/* ---------- search ---------- */
const qi = $('#q');
qi.addEventListener('input', () => { setQuery(qi.value); render(); });
$('#clr').addEventListener('click', e => { e.preventDefault(); setQuery(''); render(); qi.focus(); });

/* ---------- alphabet scrubber ---------- */
const idx = $('#idx'), bubble = $('#bubble');
function buildIndex(){
  idx.hidden = present.size < 2;
  $('#idxList').innerHTML = ALPHA.map(L => `<li class="${present.has(L) ? '' : 'off'}">${L}</li>`).join('');
  fitIndex();
}
function fitIndex(){ const h = idx.clientHeight - 8; idx.style.setProperty('--lh', Math.max(11, Math.min(17, Math.floor(h / ALPHA.length))) + 'px'); }
function targetFor(L){ // a letter with nobody jumps to the next letter that has people (iOS does the same)
  let i = ALPHA.indexOf(L);
  for (let j = i; j < ALPHA.length; j++) if (present.has(ALPHA[j])) return ALPHA[j];
  for (let j = i; j >= 0; j--) if (present.has(ALPHA[j])) return ALPHA[j];
  return null;
}
let cur = null;
function scrubAt(y){
  const ol = $('#idxList'), r = ol.getBoundingClientRect();
  const i = Math.max(0, Math.min(ALPHA.length - 1, Math.floor((y - r.top - 4) / ((r.height - 8) / ALPHA.length))));
  const L = ALPHA[i];
  bubble.textContent = L; bubble.style.top = Math.max(r.top + 28, Math.min(r.bottom - 28, y)) + 'px'; bubble.classList.add('on');
  if (L === cur) return; cur = L;
  const T = targetFor(L); if (!T) return;
  let sec = document.getElementById('sec-' + T);
  if (!sec) {   // not loaded yet: grow the window up to the end of that letter (the app would fetch to that offset)
    let last = -1; hitsNow.forEach((m, i) => { if (letterOf(m) === T) last = i; });
    shown = Math.ceil((last + 1) / WINDOW) * WINDOW; render(); sec = document.getElementById('sec-' + T);
    sec && sec.classList.add('in');
  }
  if (sec) window.scrollTo(0, sec.getBoundingClientRect().top + scrollY - (parseFloat(getComputedStyle(root).getPropertyValue('--safe-top')) + $('#tools').offsetHeight) + 1);
  if (navigator.vibrate) try { navigator.vibrate(4); } catch {}
}
idx.addEventListener('pointerdown', e => { e.preventDefault(); idx.setPointerCapture(e.pointerId); idx.classList.add('drag'); cur = null; scrubAt(e.clientY); });
idx.addEventListener('pointermove', e => { if (idx.hasPointerCapture(e.pointerId)) scrubAt(e.clientY); });
const endScrub = () => { idx.classList.remove('drag'); bubble.classList.remove('on'); cur = null; };
idx.addEventListener('pointerup', endScrub); idx.addEventListener('pointercancel', endScrub); idx.addEventListener('lostpointercapture', endScrub);

/* reveal once */
let io;
function armReveal(){
  if (!('IntersectionObserver' in window)) { $$('.rv').forEach(n => n.classList.add('in')); return; }
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -6% 0px' });
  $$('.rv:not(.in)').forEach(n => io.observe(n));
}

/* press feedback */
document.addEventListener('pointerdown', e => { const p = e.target.closest('.pressable'); if (!p) return; p.classList.add('is-pressed');
  const up = () => { p.classList.remove('is-pressed'); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
  addEventListener('pointerup', up); addEventListener('pointercancel', up); });

/* glass header: one class toggle when the large title scrolls under the pills (no per-frame style writes) */
function measure(){ root.style.setProperty('--tools-h', $('#tools').offsetHeight + 'px'); root.style.setProperty('--title-h', ($('#title').offsetHeight + 10) + 'px'); fitIndex(); }
let stuck = null, tick = false;
function onScroll(){ if (tick) return; tick = true; requestAnimationFrame(() => { tick = false;
  const s = scrollY > $('#title').offsetTop + $('#title').offsetHeight - parseFloat(getComputedStyle(root).getPropertyValue('--safe-top'));
  if (s !== stuck) { stuck = s; root.classList.toggle('stuck', s); } }); }
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', measure);

addEventListener('message', e => { const d = e.data; if (!d || d.type !== 'pv-state') return;
  if (d.theme) state.theme = pick(d.theme, ['light','dark','system'], state.theme);
  if (d.motion) state.motion = pick(d.motion, ['full','reduced','auto'], state.motion);
  applyTheme(); applyMotion(); });
mqRed.addEventListener && mqRed.addEventListener('change', applyMotion);

applyTheme(); applyMotion(); renderActive(); render(); onScroll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
</body>
</html>
