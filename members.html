<!doctype html>
<!--
  UA WELL /members — the «Учасники» directory in VARIANT B's language (v3, after the 5-angle review)
  ==================================================================================================
  Every row answers "who is this?": photo · name · «Чим займаюся» headline (ONE line, ellipsis) · city · package.
  No headline -> the member's first industry, muted (a display fallback only, never stored as the headline).

  DATA: realistic demo base (Штутгарт / Мюнхен / Аугсбург / Ульм / Фрідріхсгафен, real industry + interest labels).
    The whole directory loads at once (~92 active members today fit in one request), so there is no «Показати ще».
  LAYOUT (390x844, Telegram fullscreen, safe top T = 92 — the app uses --app-safe-top, not a constant)
    large title «Учасники 25» (or «5 з 25» while searching/filtering)
    sticky: search + «Фільтри» button (count badge) only. Active-filter chips sit in the flow and scroll away.
    «Ви» card first: your own row exactly as others see it (or a prompt to add your headline).
    one continuous plain list (no card per letter), hairlines inset to the text column, opaque sticky letter headers
  SORT + SECTIONS by FIRST name, uk collation; non-Ukrainian-alphabet initials (Latin, digits) go to «#», last.
  SEARCH: tokens AND-matched over name + headline + industry; apostrophes ' ’ ʼ fold together.
    While a query is active: one flat ranked list (name prefix > name > headline > industry), no letters, no scrubber.
  FILTER SHEET: Сфера діяльності · Місто · Інтереси · Пакет (all chips). Live-apply, OR inside a section, AND across.
    Options are ordered by count when the sheet opens (stable while you tap); zero-count options fold under
    «Ще N без збігів»; long sections show the top 8 + «Усі (N)». 0 results -> «Показати 0» + "remove X -> N" hint.
  ACTIVE CHIPS: one per section («Місто: Мюнхен, Ульм ✕»), tap opens the sheet at that section; «Скинути» if 2+.
  ALPHABET STRIP (iPhone Contacts): only for long lists (> 15 rows), hidden while searching or typing; uniform colour;
    condenses to «А • В • …» when letters would be < 14px; bubble sits ~96px in from the edge, above the finger;
    Telegram HapticFeedback.selectionChanged() per target change (navigator.vibrate is a no-op on iOS);
    inset 16px from the edge on Android (system back-swipe zone). aria-hidden: headings are the accessible path.
  ROW PRESS: background tint after 80ms, cancelled on move/scroll (no scale on rows).
-->
<html lang="uk" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --font: "Geist", -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --safe-top: 92px;           /* status bar + Telegram pill row (simulated --app-safe-top) */
  --safe-bottom: 34px;
  --tabbar-h: 56px;
  --ease: cubic-bezier(.32,.72,0,1);

  --bg:#FAF9F7; --surface:#FFFFFF; --text:#1C1C1C; --muted:#57534E; --tertiary:#78716C;
  --hairline:#ECEAE5; --line:#DCD8D0; --brand:#FF8912; --on-brand:#1C1C1C; --ink:#B45309;
  --tile:#F3F1EC; --tile-fg:#57534E; --tile-ink:rgba(180,83,9,.10);
  --press: rgba(28,28,28,.045);
  --seg-track:#EFEDE8; --seg-thumb:#FFFFFF; --seg-thumb-shadow: 0 1px 2px rgba(28,25,23,.08), 0 3px 8px -2px rgba(28,25,23,.12);
  --card-shadow: 0 0 0 .5px #ECEAE5, 0 1px 2px rgba(28,25,23,.04), 0 8px 24px -12px rgba(28,25,23,.10);
  --card-shadow-press: 0 0 0 .5px #ECEAE5;
  --admin-shadow: 0 0 0 .5px #ECEAE5, 0 1px 2px rgba(28,25,23,.05), 0 12px 28px -12px rgba(180,83,9,.22);
  --admin-glow: rgba(255,137,18,.10);
  --lip: 0 -12px 32px rgba(0,0,0,.18);
  --chrome-bg: color-mix(in oklab, var(--surface) 88%, transparent);
  --toast-bg: #1C1C1C; --toast-fg:#FAF9F7;
  --sheet-bg:#FFFFFF;
  --photo-color:#3b3a33;
  --veil-max:.35;
  --ok:#15803D; --ok-bg:rgba(22,163,74,.12); --bad:#B91C1C; --bad-bg:rgba(220,38,38,.10);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181819; --surface:#242426; --text:#F5F5F4; --muted:#B8B3AD; --tertiary:#8F8A82;
    --hairline:#2C2C2F; --line:#3A3A3E; --ink:#FF8912;
    --tile:#2F2F33; --tile-fg:#B8B3AD; --tile-ink:rgba(255,137,18,.14);
    --press: rgba(245,245,244,.06);
    --seg-track:#1C1C1E; --seg-thumb:#3A3A3E; --seg-thumb-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    --card-shadow: 0 0 0 1px #2C2C2F, inset 0 1px 0 rgba(255,255,255,.04);
    --card-shadow-press: 0 0 0 1px #2C2C2F;
    --admin-shadow: 0 0 0 1px #3A3A3E, inset 0 1px 0 rgba(255,255,255,.05);
    --admin-glow: rgba(255,137,18,.09);
    --lip: 0 -12px 32px rgba(0,0,0,.4);
    --toast-bg:#F5F5F4; --toast-fg:#1C1C1C;
    --sheet-bg:#242426;
    --veil-max:.5;
    --ok:#4ADE80; --ok-bg:rgba(74,222,128,.14); --bad:#F87171; --bad-bg:rgba(248,113,113,.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181819; --surface:#242426; --text:#F5F5F4; --muted:#B8B3AD; --tertiary:#8F8A82;
  --hairline:#2C2C2F; --line:#3A3A3E; --ink:#FF8912;
  --tile:#2F2F33; --tile-fg:#B8B3AD; --tile-ink:rgba(255,137,18,.14);
  --press: rgba(245,245,244,.06);
  --seg-track:#1C1C1E; --seg-thumb:#3A3A3E; --seg-thumb-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  --card-shadow: 0 0 0 1px #2C2C2F, inset 0 1px 0 rgba(255,255,255,.04);
  --card-shadow-press: 0 0 0 1px #2C2C2F;
  --admin-shadow: 0 0 0 1px #3A3A3E, inset 0 1px 0 rgba(255,255,255,.05);
  --admin-glow: rgba(255,137,18,.09);
  --lip: 0 -12px 32px rgba(0,0,0,.4);
  --toast-bg:#F5F5F4; --toast-fg:#1C1C1C;
  --sheet-bg:#242426;
  --veil-max:.5;
  --ok:#4ADE80; --ok-bg:rgba(74,222,128,.14); --bad:#F87171; --bad-bg:rgba(248,113,113,.14);
  color-scheme: dark;
}

/* ---------- reset / mobile-web ---------- */
*,*::before,*::after{box-sizing:border-box}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);
  scroll-padding-top:calc(var(--safe-top) + 8px);scroll-padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 8px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow-x:hidden}
button,a{font:inherit;color:inherit;-webkit-touch-callout:none;touch-action:manipulation}
button{background:none;border:0;padding:0;margin:0;cursor:pointer}
a{text-decoration:none}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html.theme-anim body, html.theme-anim .card, html.theme-anim .panel, html.theme-anim .tabbar-glass, html.theme-anim .seg{
  transition:background-color .28s ease, color .28s ease, box-shadow .28s ease}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}


.col{position:relative;width:100%;max-width:430px;margin:0 auto}
.fixed-col{position:fixed;left:0;right:0;margin:0 auto;width:100%;max-width:430px}
html.locked,html.locked body{overflow:hidden}

/* ---------- top glass (behind the Telegram pills) ---------- */
#top{top:0;z-index:20;pointer-events:none;height:calc(var(--safe-top) + var(--tools-h,60px))}
#top .glass-bar{position:absolute;inset:0;background:color-mix(in oklab,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:0 .5px 0 var(--line);
  opacity:0;transition:opacity .22s ease}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ #top .glass-bar{background:var(--bg)} }
#top .ttl{position:absolute;left:50%;top:70px;transform:translate(-50%,-50%) translateY(6px);font-size:15px;font-weight:650;letter-spacing:-.01em;
  opacity:0;transition:opacity .22s ease,transform .3s var(--ease)}
html.stuck #top .glass-bar{opacity:1}
html.stuck #top .ttl{opacity:1;transform:translate(-50%,-50%)}
html.reduced #top .ttl{transform:translate(-50%,-50%)}

/* ---------- flow ---------- */
main{padding:calc(var(--safe-top) + 4px) 0 calc(var(--tabbar-h) + var(--safe-bottom) + 24px)}
.lt-title{display:flex;align-items:baseline;gap:10px;margin:0 16px 8px 20px;font-size:34px;font-weight:720;letter-spacing:-.03em;line-height:1.1}
.lt-title .n{font-size:17px;font-weight:500;color:var(--tertiary);letter-spacing:0;font-variant-numeric:tabular-nums}

.tools{position:sticky;top:var(--safe-top);z-index:21;padding:6px 16px 10px}
.trow{display:flex;gap:8px;margin:0}
.search{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 12px;border-radius:12px;background:var(--tile);color:var(--muted);transition:background-color .2s ease}
.search svg.i{width:18px;height:18px}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--text);padding:0}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{background:color-mix(in oklab,var(--tile) 70%,var(--line))}
.clr{flex:none;width:44px;height:44px;margin:0 -4px 0 0;border-radius:50%;display:none;place-items:center;color:var(--muted)}
.clr svg.i{width:16px;height:16px;stroke-width:2.25}
.search.has .clr{display:grid}
.fbtn{position:relative;flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tile);color:var(--text);transition:background-color .2s ease,transform .25s var(--ease)}
.fbtn svg.i{width:20px;height:20px}
.fbtn.on{background:var(--brand);color:#1C1C1C}
.fbtn .badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;display:none;place-items:center;
  font:700 11.5px/1 var(--font);font-variant-numeric:tabular-nums;color:var(--bg);background:var(--text);box-shadow:0 0 0 2px var(--bg)}
.fbtn.on .badge{display:grid}
html.reduced .fbtn{transition:background-color .2s ease}

.active{display:flex;gap:6px;margin:0 0 6px;padding:2px 16px 4px;overflow-x:auto;scrollbar-width:none}
.active::-webkit-scrollbar{display:none}
.active:empty{display:none}
.ac{flex:none;display:inline-flex;align-items:center;height:34px;border-radius:999px;font-size:14px;font-weight:550;color:var(--text);background:var(--tile);overflow:hidden}
.ac .lb{height:100%;display:flex;align-items:center;padding:0 4px 0 12px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .lb b{font-weight:650;margin-right:4px;color:var(--muted)}
.ac .x{width:34px;height:100%;display:grid;place-items:center;color:var(--muted)}
.ac .x svg.i{width:14px;height:14px;stroke-width:2.4}
.ac.all{padding:0 14px;color:var(--ink);background:none;box-shadow:inset 0 0 0 1px var(--line)}
html:not(.reduced) .pressable{transition:transform .25s var(--ease)}
html:not(.reduced) .pressable.is-pressed{transform:scale(.97)}

/* «Ви» card */
.me{margin:4px 16px 14px;padding:4px 0;border-radius:16px;background:var(--surface);box-shadow:var(--card-shadow)}
.me .cap{display:block;padding:8px 16px 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.me .m{padding-right:20px}
.add{display:inline-flex;white-space:nowrap;align-items:center;gap:4px;font-size:14.5px;font-weight:600;color:var(--ink)}
.add svg.i{width:15px;height:15px;stroke-width:2.4}
.draft{font-size:12.5px;font-weight:600;color:var(--ink)}

/* list */
#list ul{list-style:none;margin:0;padding:0}
.lt{position:sticky;top:calc(var(--safe-top) + var(--tools-h,60px));z-index:10;margin:0;padding:8px 20px 5px;
  font-size:14px;font-weight:650;letter-spacing:.01em;color:var(--muted);background:var(--bg);box-shadow:0 .5px 0 var(--hairline)}
.m{position:relative;display:flex;align-items:center;gap:14px;padding:10px 44px 10px 16px;min-height:72px;width:100%;text-align:left;color:inherit;transition:background-color .15s ease}
li + li > .m::before{content:"";position:absolute;top:0;left:82px;right:0;height:1px;background:var(--hairline);transform:scaleY(.5);transform-origin:top}
.m.hl-press{background:var(--press)}
.m:focus-visible{outline-offset:-3px;border-radius:12px}
.av{width:52px;height:52px;border-radius:50%;flex:none;object-fit:cover;object-position:50% 25%;background:var(--tile)}
.av.ini{display:grid;place-items:center;font-size:18px;font-weight:650;letter-spacing:-.02em;color:#1C1C1C;
  background:radial-gradient(120% 120% at 28% 18%,#FFC27A 0,#FF8912 46%,#C2600A 100%)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{font-size:16px;font-weight:620;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl{font-size:14.5px;line-height:1.3;font-weight:450;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl.fb{color:var(--tertiary);font-weight:400}
.mt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tertiary);white-space:nowrap;overflow:hidden}
.lv{display:inline-flex;align-items:center;gap:5px}
.lvdot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--lvc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.business{--lvc:var(--brand)} .standard{--lvc:#8F8A82} .start{--lvc:transparent}
.start .lvdot{box-shadow:inset 0 0 0 1.5px var(--tertiary)}
mark{background:rgba(255,137,18,.30);color:inherit;font-weight:inherit;border-radius:3px;padding:0;box-shadow:0 0 0 1px rgba(255,137,18,.30)}
.flat{margin-top:6px}

.empty{margin:48px 28px 0;text-align:center;color:var(--muted)}
.empty .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--tile);color:var(--muted)}
.empty h3{margin:0 0 6px;font-size:17px;font-weight:650;color:var(--text)}
.empty p{margin:0 0 16px;font-size:14.5px}
.empty .btns{display:flex;flex-direction:column;align-items:center;gap:8px}
.empty button{min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;color:var(--ink);background:var(--tile-ink)}
.empty button.sec2{background:none;color:var(--muted)}
html:not(.reduced) #list.first{animation:fadeIn .32s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- alphabet strip ---------- */
#idx{position:fixed;z-index:25;right:calc(max(0px,(100vw - 430px) / 2) + var(--idx-inset,0px));width:28px;
  top:calc(var(--safe-top) + var(--title-h,50px) + var(--tools-h,60px) + 8px);bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 10px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
html.android{--idx-inset:16px}
#idx[hidden]{display:none}
#idx ol{list-style:none;margin:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;border-radius:14px;transition:background-color .2s ease}
#idx li{font-size:11px;font-weight:650;line-height:1;color:var(--ink);height:var(--lh,15px);display:grid;place-items:center;width:28px}
#idx li.dot{font-size:9px}
#idx.drag ol{background:var(--tile)}
#bubble{position:fixed;z-index:26;right:calc(max(0px,(100vw - 430px) / 2) + 96px);width:60px;height:60px;margin-top:-74px;border-radius:50%;
  display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--text);background:var(--surface);
  box-shadow:0 0 0 .5px var(--line),0 12px 28px -8px rgba(0,0,0,.35);opacity:0;transform:scale(.7);transition:opacity .15s ease,transform .2s var(--ease);pointer-events:none}
#bubble.on{opacity:1;transform:none}
html.reduced #bubble{transform:none;transition:opacity .15s ease}

/* ---------- filter sheet ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s ease;touch-action:none}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;margin:0 auto;width:100%;max-width:430px;bottom:0;z-index:71;max-height:calc(100% - var(--safe-top) - 6px);display:flex;flex-direction:column;
  background:var(--sheet-bg);border-radius:32px 32px 0 0;transform:translateY(105%);transition:transform .42s var(--ease);box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.sheet.open{transform:none}
.sheet:focus{outline:none}
.sheet:not(.open){visibility:hidden;transition:transform .42s var(--ease),visibility 0s .42s}
html.reduced .sheet{transform:none;opacity:0;transition:opacity .15s ease,visibility 0s .15s}
html.reduced .sheet.open{opacity:1;transition:opacity .15s ease}
.sh-top{flex:none;padding:8px 16px 4px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.sh-head h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sh-x{background:var(--tile);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;position:relative}
.sh-x::after{content:"";position:absolute;inset:-6px}
.sh-x svg.i{width:16px;height:16px;stroke-width:2.25}
.sh-note{margin:6px 4px 0;font-size:13px;color:var(--muted)}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 16px}
.fs{margin-top:22px;scroll-margin-top:8px}
.fs:first-child{margin-top:10px}
.fs-h{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px;min-height:32px}
.fs-h h4{margin:0;font-size:15px;font-weight:650;letter-spacing:-.005em}
.clr2{position:relative;font-size:13.5px;font-weight:600;color:var(--ink);padding:6px 0}
.clr2::after{content:"";position:absolute;inset:-6px -8px}
.fsearch{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--tile);color:var(--muted);margin-bottom:10px}
.fsearch svg.i{width:16px;height:16px}
.fsearch input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--text)}
.fsearch input::placeholder{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:8px 13px;border-radius:19px;font-size:14.5px;line-height:1.25;font-weight:550;color:var(--text);text-align:left;
  background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);transition:background-color .2s ease,box-shadow .2s ease,color .2s ease,transform .25s var(--ease)}
.tag .c{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tag svg.i{width:15px;height:15px;stroke-width:2.6;display:none;flex:none}
.tag .lvdot{width:8px;height:8px}
.tag[aria-pressed="true"]{background:var(--brand);color:#1C1C1C;box-shadow:none}
.tag[aria-pressed="true"] .c{color:#1C1C1C}
.tag[aria-pressed="true"] svg.i{display:block}
.tag.zero:not([aria-pressed="true"]){color:var(--muted);background:none}
.more2{min-height:38px;padding:0 6px;font-size:14px;font-weight:600;color:var(--ink)}
.tags .none{font-size:14px;color:var(--muted);padding:6px 4px}
.sh-foot{flex:none;padding:10px 16px calc(var(--safe-bottom) + 8px);box-shadow:0 -.5px 0 var(--line)}
.hint{margin:0 4px 10px;font-size:13.5px;color:var(--muted)}
.hint button{color:var(--ink);font-weight:600;min-height:32px}
.fbtns{display:flex;gap:10px}
.fbtns button{height:50px;border-radius:14px;font-size:16px;font-weight:650}
.fbtns .rs{flex:none;padding:0 18px;color:var(--text);background:var(--tile)}
.fbtns .rs:disabled{opacity:.45}
.fbtns .go{flex:1;color:#1C1C1C;background:var(--brand);box-shadow:0 8px 20px -10px rgba(255,137,18,.8);font-variant-numeric:tabular-nums}
.fbtns .go.zero{color:var(--text);background:var(--tile);box-shadow:none}

/* ---------- tab bar ---------- */
.tabbar{bottom:0;z-index:40;height:calc(var(--tabbar-h) + var(--safe-bottom))}
.tabbar-glass{position:absolute;inset:0;background:var(--chrome-bg);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 -.5px 0 var(--line)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h);padding:0 4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--tertiary);border-radius:12px;min-width:0}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab svg.i{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab .av{width:25px;height:25px;border-radius:50%;object-fit:cover;object-position:50% 30%;box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--brand)}
.tab .av.ini{display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;background:radial-gradient(80% 80% at 20% 20%,#FF8912,#B45309)}
.tab:focus-visible{outline-offset:-2px}

/* ---------- simulated system chrome (NOT part of the design) ---------- */
.sys{z-index:100;pointer-events:none}
.sb{top:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;color:var(--sb,#fff);
  font:600 16.5px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;letter-spacing:-.01em;transition:color .25s ease}
.sb .gl{display:flex;gap:6px;align-items:center}
.pill{position:absolute;top:53px;height:34px;border-radius:17px;background:rgba(44,44,48,.46);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);font:500 15px/1 -apple-system,system-ui,sans-serif}
.pill.l{left:14px;padding:0 14px 0 11px;gap:6px}
.pill.r{right:14px;padding:0 6px;gap:0}
.pill.r i{width:36px;display:grid;place-items:center;font-style:normal}
.pill.r b{width:1px;height:16px;background:rgba(255,255,255,.25)}
.home-ind{bottom:8px;left:0;right:0;width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.9;z-index:101;pointer-events:none}


.sb{--sb:var(--text)}

/* ---------- names: one grouping key, used for sort, sections and the strip ---------- */
const coll = new Intl.Collator('uk');
const ALPHA = 'АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЮЯ'.split('').concat('#');
const graphemes = s => Array.from(s.normalize('NFC'));
function letterOf(m){
  const g = graphemes((m.f || '').replace(/^[^\p{L}]+/u, ''))[0];
  const L = g ? g.toLocaleUpperCase('uk') : '#';
  return ALPHA.includes(L) ? L : '#';
}
function initials(m){ const a = graphemes(m.f || '')[0] || '', b = graphemes(m.l || '')[0] || ''; return (a + b).toLocaleUpperCase('uk') || '?'; }
M.forEach(m => m.L = letterOf(m));
M.sort((a, b) => (ALPHA.indexOf(a.L) - ALPHA.indexOf(b.L)) || coll.compare(a.f, b.f) || coll.compare(a.l, b.l));
const ME = M.find(m => m.id === ME_ID);
const ME_HEADLINE = ME.h;

/* ---------- search: tokens, folded apostrophes, AND across tokens ---------- */
const foldCh = ch => /['’‘ʼʹ`′]/.test(ch) ? "'" : (ch.toLocaleLowerCase('uk')[0] || ch);
const fold = s => Array.from(s).map(foldCh).join('');
const tokens = () => fold(query).split(/\s+/).filter(Boolean).slice(0, 6);
const nameOf = m => `${m.f} ${m.l}`;
function score(m, toks){ // lower is better; Infinity = no match
  const name = fold(nameOf(m)), hl = fold(m.h), ind = fold(m.ind.join(' · '));
  let worst = 0;
  for (const t of toks) {
    let s = Infinity;
    if (name.split(' ').some(w => w.startsWith(t))) s = 0;
    else if (name.includes(t)) s = 1;
    else if (hl.includes(t)) s = 2;
    else if (ind.includes(t)) s = 3;
    if (s === Infinity) return Infinity;
    worst = Math.max(worst, s);
  }
  return worst;
}
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch]);
function mark(text, toks){ // fold is 1:1 per code point, so indices line up with the original
  if (!toks.length) return esc(text);
  const chars = Array.from(text), f = chars.map(foldCh);
  const on = new Array(chars.length).fill(false);
  for (const t of toks) { const tc = Array.from(t); outer: for (let i = 0; i + tc.length <= f.length; i++) { for (let j = 0; j < tc.length; j++) if (f[i + j] !== tc[j]) continue outer; for (let j = 0; j < tc.length; j++) on[i + j] = true; break; } }
  let out = '', open = false;
  chars.forEach((c, i) => { if (on[i] && !open) { out += '<mark>'; open = true; } if (!on[i] && open) { out += '</mark>'; open = false; } out += esc(c); });
  return out + (open ? '</mark>' : '');
}

/* ---------- filters: OR inside a section, AND across ---------- */
const SECTIONS = [
  { key:'ind', title:'Сфера діяльності', search:'Пошук сфери…', all: () => [...new Set(M.flatMap(m => m.ind))] },
  { key:'c',   title:'Місто',            search:'Пошук міста…', all: () => [...new Set(M.map(m => m.c).filter(Boolean))] },
  { key:'int', title:'Інтереси',         search:'Пошук інтересу…', all: () => [...new Set(M.flatMap(m => m.int))] },
  { key:'lv',  title:'Пакет', all: () => ['start','standard','business'], label: v => LV[v], fixed: true },
];
const SEC = Object.fromEntries(SECTIONS.map(s => [s.key, s]));
const sel = { ind:new Set(), c:new Set(), int:new Set(), lv:new Set() };
const labelOf = (k, v) => SEC[k].label ? SEC[k].label(v) : v;
const has = (m, k, vals) => (k === 'ind' || k === 'int') ? m[k].some(v => vals.has(v)) : vals.has(m[k]);
const passFilters = (m, skip) => { for (const k in sel) if (k !== skip && sel[k].size && !has(m, k, sel[k])) return false; return true; };
const selCount = () => Object.values(sel).reduce((n, s) => n + s.size, 0);
const activeSections = () => SECTIONS.filter(s => sel[s.key].size);

let query = '';
function results(){ const t = tokens(); return M.filter(m => passFilters(m) && score(m, t) < Infinity); }

/* ---------- rows ---------- */
function avatar(m){
  if (m.ph) return `<img class="av" src="${esc(m.ph)}" alt="" loading="lazy" decoding="async" data-ini="${esc(initials(m))}">`;
  return `<span class="av ini" aria-hidden="true">${esc(initials(m))}</span>`;
}
// broken photo -> initials (capture phase: error doesn't bubble)
document.addEventListener('error', e => { const t = e.target; if (t.tagName === 'IMG' && t.dataset.ini) { const s = document.createElement('span'); s.className = 'av ini'; s.textContent = t.dataset.ini; t.replaceWith(s); } }, true);
function second(m, toks){
  if (m.h) return `<span class="hl">${mark(m.h, toks)}</span>`;
  if (m.ind.length) return `<span class="hl fb">${mark(m.ind[0], toks)}</span>`;   // display fallback only
  return '';
}
// search matched only on an industry the row doesn't show: show that industry (marked) instead of city · package
function whyLine(m, toks){
  if (!toks.length || !m.h) return '';
  const f = fold(nameOf(m) + ' ' + m.h);
  if (toks.every(t => f.includes(t))) return '';
  const hit = m.ind.find(v => toks.some(t => fold(v).includes(t)));
  return hit ? `<span class="mt">Сфера: ${mark(hit, toks)}</span>` : '';
}
function meta(m){
  const parts = [];
  if (m.c) parts.push(`<span>${esc(m.c)}</span>`);
  parts.push(`<span class="lv ${m.lv}"><span class="lvdot"></span>${LV[m.lv]}</span>`);
  return `<span class="mt">${parts.join('<span aria-hidden="true">·</span>')}</span>`;
}
function row(m, toks){
  const sr = [m.h || m.ind[0] || '', m.c, LV[m.lv]].filter(Boolean).join(', ');
  return `<a class="m" href="variant-b.html?view=other&admin=0" aria-label="${esc(nameOf(m))}, ${esc(sr)}">${avatar(m)}<span class="tx" aria-hidden="true">`
    + `<span class="nm">${mark(nameOf(m), toks)}</span>${second(m, toks)}${whyLine(m, toks) || meta(m)}</span></a>`;
}

let present = new Set();
function render(){
  const toks = tokens(), searching = toks.length > 0;
  renderMe();
  const hits = results();
  const total = M.length, narrowed = searching || selCount() > 0;
  $('#count').textContent = narrowed ? `${hits.length} з ${total}` : total;
  $('#status').textContent = narrowed ? `Знайдено ${hits.length}` : '';
  const list = $('#list');
  if (!hits.length) { renderEmpty(list, toks); present = new Set(); syncIdx(0); return; }
  let html = '';
  if (searching) {
    const ranked = hits.map(m => [score(m, toks), m]).sort((a, b) => a[0] - b[0] || coll.compare(a[1].f, b[1].f)).map(x => x[1]);
    html = `<ul class="flat" role="list">${ranked.map(m => `<li>${row(m, toks)}</li>`).join('')}</ul>`;
    present = new Set();
  } else {
    const groups = new Map();
    hits.forEach(m => { if (!groups.has(m.L)) groups.set(m.L, []); groups.get(m.L).push(m); });
    for (const [L, ms] of groups) html += `<section class="sec" id="sec-${L === '#' ? 'hash' : L}"><h2 class="lt">${L}</h2><ul role="list">${ms.map(m => `<li>${row(m, toks)}</li>`).join('')}</ul></section>`;
    present = new Set(groups.keys());
  }
  list.innerHTML = html;
  syncIdx(hits.length);
}
function renderEmpty(list, toks){
  const q = query.trim(), f = selCount();

  let text, btns = '';

$('#list').addEventListener('click', e => {

/* ---------- active chips: one per section ---------- */
function renderActive(){

      + `<button class="x" type="button" data-drop="${s.key}" aria-label="Прибрати фільтр «${esc(s.title)}»">${svg('x')}</button></span>`; }).join('');

}
$('#activeChips').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { openSheet(o.dataset.open); return; }
  const d = e.target.closest('[data-drop]'); if (!d) return;

/* ---------- filter sheet: order frozen at open, counts update in place ---------- */
const fq = { ind:'', c:'', int:'' }, expanded = {};
let order = {};
function countFor(k, v){ const t = tokens(); return M.filter(m => passFilters(m, k) && score(m, t) < Infinity && ((k === 'ind' || k === 'int') ? m[k].includes(v) : m[k] === v)).length; }
function freezeOrder(){
  order = {};
  for (const s of SECTIONS) {
    const opts = s.all();
    order[s.key] = s.fixed ? opts : opts.map(v => [v, countFor(s.key, v)]).sort((a, b) => b[1] - a[1] || coll.compare(a[0], b[0])).map(x => x[0]);
  }
}
const plural = n => (n % 10 === 1 && n % 100 !== 11) ? 'учасник' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'учасники' : 'учасників';
function tagHtml(k, v){
  const c = countFor(k, v), on = sel[k].has(v);
  return `<button class="tag pressable${c ? '' : ' zero'}" type="button" data-k="${k}" data-v="${esc(v)}" aria-pressed="${on}" aria-label="${esc(labelOf(k, v))}, ${c} ${plural(c)}">`
    + svg('check') + (k === 'lv' ? `<span class="lv ${v}"><span class="lvdot"></span></span>` : '') + `<span>${esc(labelOf(k, v))}</span><span class="c" aria-hidden="true">${c}</span></button>`;
}
function tagsHtml(s){
  const k = s.key, f = fold(fq[k] || '').trim();
  let opts = order[k];
  if (f) { opts = opts.filter(v => fold(v).includes(f)); return opts.length ? opts.map(v => tagHtml(k, v)).join('') : `<span class="none">Нічого не знайдено</span>`; }
  if (s.fixed) return opts.map(v => tagHtml(k, v)).join('');
  const live = opts.filter(v => countFor(k, v) > 0 || sel[k].has(v)), zero = opts.filter(v => !live.includes(v));
  const LIMIT = 8;
  let shown = live, rest = [];
  if (!expanded[k] && live.length > LIMIT) { shown = live.slice(0, LIMIT); rest = live.slice(LIMIT); }
  let html = shown.map(v => tagHtml(k, v)).join('');
  if (rest.length) html += `<button class="more2" type="button" data-exp="${k}">Усі (${live.length})</button>`;
  else if (zero.length && !expanded[k + ':0']) html += `<button class="more2" type="button" data-exp="${k}:0">Ще ${zero.length} без збігів</button>`;
  else html += zero.map(v => tagHtml(k, v)).join('');
  return html;
}
function buildSheet(){
  freezeOrder();
  $('#shBody').innerHTML = SECTIONS.map(s => `<section class="fs" id="fs-${s.key}" aria-labelledby="fsh-${s.key}">`
    + `<div class="fs-h"><h4 id="fsh-${s.key}">${s.title}</h4><button class="clr2" type="button" data-clear="${s.key}" hidden></button></div>`
    + (s.search && s.all().length > 8 ? `<label class="fsearch">${svg('search')}<span class="sr-only">${s.search}</span><input data-fq="${s.key}" type="search" autocomplete="off" placeholder="${s.search}"></label>` : '')
    + `<div class="tags" id="tags-${s.key}"></div></section>`).join('');
  SECTIONS.forEach(s => { const inp = $(`[data-fq="${s.key}"]`); if (inp) inp.value = fq[s.key] || ''; });
  refreshSheet(true);
}
function refreshSheet(full){
  for (const s of SECTIONS) {
    const box = $(`#tags-${s.key}`);
    if (full) box.innerHTML = tagsHtml(s);
    else $$('.tag', box).forEach(b => { // update in place: no reorder under the finger, focus stays put
      const k = b.dataset.k, v = b.dataset.v, c = countFor(k, v), on = sel[k].has(v);
      b.setAttribute('aria-pressed', String(on)); b.classList.toggle('zero', !c);
      b.querySelector('.c').textContent = c; b.setAttribute('aria-label', `${labelOf(k, v)}, ${c} ${plural(c)}`);
    });
    const n = sel[s.key].size, cb = $(`[data-clear="${s.key}"]`);
    cb.hidden = !n; cb.textContent = `Скинути (${n})`;
  }
  const q = query.trim();
  $('#shNote').hidden = !q; $('#shNote').textContent = q ? `З урахуванням пошуку «${q}»` : '';
  const n = results().length, go = $('#shGo');
  go.textContent = `Показати ${n}`; go.classList.toggle('zero', !n);
  $('#shReset').disabled = !selCount();
  const hint = $('#shHint');
  if (!n && selCount()) { // which single value, removed, gives the most people back
    let best = null;
    for (const k in sel) for (const v of [...sel[k]]) { sel[k].delete(v); const c = results().length; sel[k].add(v); if (c && (!best || c > best.c)) best = { k, v, c }; }
    hint.hidden = !best;
    if (best) hint.innerHTML = `Приберіть «${esc(labelOf(best.k, best.v))}» — знайдеться ${best.c}. <button type="button" data-k="${best.k}" data-v="${esc(best.v)}">Прибрати</button>`;
  } else hint.hidden = true;
}
$('#shBody').addEventListener('click', e => {
  const x = e.target.closest('[data-exp]'); if (x) { expanded[x.dataset.exp] = true; const k = x.dataset.exp.split(':')[0]; $(`#tags-${k}`).innerHTML = tagsHtml(SEC[k]); return; }
  const c = e.target.closest('[data-clear]'); if (c) { sel[c.dataset.clear].clear(); afterFilter(); return; }
  const b = e.target.closest('.tag'); if (!b) return;
  const set = sel[b.dataset.k], v = b.dataset.v;
  set.has(v) ? set.delete(v) : set.add(v);

  afterFilter();
});
$('#shHint').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; sel[b.dataset.k].delete(b.dataset.v); afterFilter(); });
$('#shBody').addEventListener('input', e => { const k = e.target.dataset.fq; if (!k) return; fq[k] = e.target.value; $(`#tags-${k}`).innerHTML = tagsHtml(SEC[k]); });
function afterFilter(){ renderActive(); render(); if (sheetOpen) refreshSheet(false); }

let sheetOpen = false, lastFocus = null;
function openSheet(section){
  sheetOpen = true; lastFocus = document.activeElement; buildSheet(); root.classList.add('locked');
  $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); $('#sheet').setAttribute('aria-hidden','false');
  $('#flow').inert = true; $('#idx').inert = true;
  if (section) requestAnimationFrame(() => { const fs = $(`#fs-${section}`); fs && fs.scrollIntoView({ block:'start' }); });
  setTimeout(() => $('#sheet').focus({ preventScroll:true }), 60);
}
function closeSheet(){
  sheetOpen = false; root.classList.remove('locked');
  $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true');
  $('#flow').inert = false; $('#idx').inert = false;
  (lastFocus && document.contains(lastFocus) ? lastFocus : $('#fbtn')).focus({ preventScroll:true });
}
$('#fbtn').addEventListener('click', () => openSheet());
$('#shX').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
$('#shGo').addEventListener('click', closeSheet);
$('#shReset').addEventListener('click', () => { for (const k in sel) sel[k].clear(); afterFilter(); });
addEventListener('keydown', e => {
  if (!sheetOpen) return;
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Tab') { // focus stays inside the sheet
    const f = $$('button:not([disabled]):not([hidden]), input', $('#sheet')).filter(n => n.offsetParent);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- haptics: Telegram's, when inside Telegram ---------- */
function haptic(kind){
  const h = window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback;
  try { if (h) { kind === 'impact' ? h.impactOccurred('light') : h.selectionChanged(); } else if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(kind === 'impact' ? 6 : 3); } catch {}
}

/* ---------- alphabet strip ---------- */
const idx = $('#idx'), bubble = $('#bubble');
let lastCount = 0;
function syncIdx(count){
  if (count != null) lastCount = count;
  const searching = tokens().length > 0, typing = document.activeElement === qi;
  idx.hidden = searching || typing || lastCount <= 15 || present.size < 2;
  if (!idx.hidden) buildIdx();
}
function buildIdx(){
  const h = idx.clientHeight - 8, N = ALPHA.length, MIN = 14;
  let items;
  if (h / N >= MIN) items = ALPHA.map(L => [L, false]);
  else { // iOS condensed index: letter • letter • …
    let slots = Math.max(5, Math.floor(h / MIN)); if (slots % 2 === 0) slots--;
    items = Array.from({ length: slots }, (_, i) => i % 2 ? ['•', true] : [ALPHA[Math.round(i * (N - 1) / (slots - 1))], false]);
  }
  idx.style.setProperty('--lh', Math.min(17, Math.floor(h / items.length)) + 'px');
  $('#idxList').innerHTML = items.map(([t, d]) => `<li class="${d ? 'dot' : ''}">${t}</li>`).join('');
}
function targetFor(L){ // a letter with nobody jumps to the next letter that has people (iOS does the same)
  const i = ALPHA.indexOf(L);
  for (let j = i; j < ALPHA.length; j++) if (present.has(ALPHA[j])) return ALPHA[j];
  for (let j = i; j >= 0; j--) if (present.has(ALPHA[j])) return ALPHA[j];
  return null;
}
let curTarget = null;
function scrubAt(y){
  const r = $('#idxList').getBoundingClientRect();
  const frac = Math.max(0, Math.min(.9999, (y - r.top - 4) / (r.height - 8)));
  const L = ALPHA[Math.floor(frac * ALPHA.length)];
  bubble.textContent = L; bubble.style.top = Math.max(r.top + 74, Math.min(r.bottom, y)) + 'px'; bubble.classList.add('on');
  const T = targetFor(L); if (!T || T === curTarget) return;
  curTarget = T;
  const sec = document.getElementById('sec-' + (T === '#' ? 'hash' : T));
  if (sec) window.scrollTo(0, sec.getBoundingClientRect().top + scrollY - (92 + $('#tools').offsetHeight) + 1);
  haptic('selection');
}
idx.addEventListener('pointerdown', e => { e.preventDefault(); if (document.activeElement === qi) qi.blur(); idx.setPointerCapture(e.pointerId); idx.classList.add('drag'); curTarget = null; scrubAt(e.clientY); });
idx.addEventListener('pointermove', e => { if (idx.hasPointerCapture(e.pointerId)) scrubAt(e.clientY); });
const endScrub = () => { idx.classList.remove('drag'); bubble.classList.remove('on'); curTarget = null; };
idx.addEventListener('pointerup', endScrub); idx.addEventListener('pointercancel', endScrub); idx.addEventListener('lostpointercapture', endScrub);

/* ---------- press: buttons scale, rows only tint (after 80ms, cancelled on move/scroll) ---------- */
let pressT = 0, pressEl = null, pressY = 0;
document.addEventListener('pointerdown', e => {
  const p = e.target.closest('.pressable'); if (p) { p.classList.add('is-pressed'); const up = () => { p.classList.remove('is-pressed'); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); }; addEventListener('pointerup', up); addEventListener('pointercancel', up); }
  const r = e.target.closest('.m'); if (!r) return;
  pressEl = r; pressY = e.clientY; clearTimeout(pressT); pressT = setTimeout(() => pressEl && pressEl.classList.add('hl-press'), 80);
});
const cancelPress = () => { clearTimeout(pressT); if (pressEl) pressEl.classList.remove('hl-press'); pressEl = null; };
document.addEventListener('pointermove', e => { if (pressEl && Math.abs(e.clientY - pressY) > 6) cancelPress(); });
document.addEventListener('pointerup', () => setTimeout(cancelPress, 120));
document.addEventListener('pointercancel', cancelPress);

/* ---------- glass header: one class toggle via an observer on the title (no per-frame reads) ---------- */
function measure(){ root.style.setProperty('--tools-h', $('#tools').offsetHeight + 'px'); root.style.setProperty('--title-h', ($('#title').offsetHeight + 8) + 'px'); }
new IntersectionObserver(([e]) => root.classList.toggle('stuck', !e.isIntersecting), { rootMargin: '-100px 0px 0px 0px' }).observe($('#title'));
let lastY = 0;
addEventListener('scroll', () => { if (pressEl) cancelPress(); if (document.activeElement === qi && Math.abs(scrollY - lastY) > 24) qi.blur(); lastY = scrollY; }, { passive: true });
let rz = 0; addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { measure(); syncIdx(); }); });

addEventListener('message', e => { const d = e.data; if (!d || d.type !== 'pv-state') return;
  if (d.theme) state.theme = pick(d.theme, ['light','dark','system'], state.theme);
  if (d.motion) state.motion = pick(d.motion, ['full','reduced','auto'], state.motion);
  if (d.headline) state.headline = pick(d.headline, ['set','empty','draft'], state.headline);
  applyTheme(); applyMotion(); render(); });
mqRed.addEventListener && mqRed.addEventListener('change', applyMotion);

applyTheme(); applyMotion(); measure(); renderActive(); render();
setTimeout(() => $('#list').classList.remove('first'), 400);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); syncIdx(); });
})();
</script>
